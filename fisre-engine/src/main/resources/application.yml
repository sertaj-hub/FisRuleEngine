# PostgreSQL is the only vendor built and tested for now (ADR-0002); the Dialect seam keeps others possible.
fisre:
  db-vendor: ${FISRE_DB_VENDOR:postgresql}
  job: ${FISRE_JOB:none}                     # none | promote | clean | reopen
  batch-id: ${FISRE_BATCH_ID:}               # required by promote, clean, reopen
  schemas:                                   # logical schema -> physical schema/database/user
    stg: ${FISRE_SCHEMA_STG:stg}
    mst: ${FISRE_SCHEMA_MST:mst}
    aml: ${FISRE_SCHEMA_AML:aml}

spring:
  main:
    web-application-type: none
  datasource:
    url: ${FISRE_DB_URL:jdbc:postgresql://localhost:5432/fisre}
    username: ${FISRE_DB_USER:fisre}
    password: ${FISRE_DB_PASSWORD:fisre}
  flyway:
    locations: classpath:db/migration
    default-schema: ${fisre.schemas.aml}
    placeholders:
      stg: ${fisre.schemas.stg}
      mst: ${fisre.schemas.mst}
      aml: ${fisre.schemas.aml}
