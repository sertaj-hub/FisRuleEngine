code: NEW_COUNTERPARTY_COUNTRY
name: First wire to a new counterparty country
description: >
  A wire of $1,000 or more to a counterparty country the account has not used in the previous 30 days,
  for an account with at least five active days in that period.
template: NEW_ATTRIBUTE
status: ACTIVE
suppress_days: 0
config:
  attribute: counterparty_country
  baseline_days: 30
  filter: { txn_types: [WIRE_OUT], min_amount: 1000 }
  min_active_days: 5
tests:
  - name: established account wires to a new country; others must not alert
    as_of: 2026-09-30
    accounts: [{id: A1, product: DEPOSIT}, {id: A2, product: DEPOSIT}, {id: A3, product: DEPOSIT}, {id: A4, product: DEPOSIT}, {id: A5, product: DEPOSIT}]
