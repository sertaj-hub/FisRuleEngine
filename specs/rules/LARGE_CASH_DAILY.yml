code: LARGE_CASH_DAILY
name: Large cash activity in one day
description: Cash in or out on one account totalling more than $10,000 in a day (BSA currency transaction threshold).
template: AGGREGATE
status: ACTIVE
suppress_days: 0
config:
  window_days: 1
  filter: { cash: true }
  min_sum: 10000.01
tests:
  - name: two cash deposits totalling over the limit
    business_date: 2026-09-30
    accounts: [{id: A1, product: DEPOSIT}]
    txns:
      - {id: T1, account: A1, type: CASH_DEPOSIT, direction: CREDIT, amount: 6000, date: 2026-09-30}
      - {id: T2, account: A1, type: CASH_DEPOSIT, direction: CREDIT, amount: 5000, date: 2026-09-30}
    expect_alerts: [A1]
  - name: exactly $10,000 is not over the threshold
    business_date: 2026-09-30
    accounts: [{id: A1, product: DEPOSIT}]
    txns:
      - {id: T1, account: A1, type: CASH_DEPOSIT, direction: CREDIT, amount: 10000, date: 2026-09-30}
    expect_alerts: []
  - name: large non-cash activity is ignored; amounts on other days do not add up
    business_date: 2026-09-30
    accounts: [{id: A1, product: DEPOSIT}, {id: A2, product: DEPOSIT}]
    txns:
      - {id: T1, account: A1, type: WIRE_IN, direction: CREDIT, amount: 50000, date: 2026-09-30}
      - {id: T2, account: A2, type: CASH_DEPOSIT, direction: CREDIT, amount: 6000, date: 2026-09-29}
      - {id: T3, account: A2, type: CASH_DEPOSIT, direction: CREDIT, amount: 6000, date: 2026-09-30}
    expect_alerts: []
