code: DEBIT_SPIKE_VS_BASELINE
name: Debit activity far above the account's own norm
description: >
  Debits on the as-of day total at least five times the account's average daily debits over the previous 30 days
  and at least $5,000, for an account with at least five active days in that period.
template: BASELINE_DEVIATION
status: ACTIVE
suppress_days: 3
config:
  baseline_days: 30
  filter: { direction: DEBIT }
  metric: SUM
  multiplier: 5
  min_value: 5000
  min_active_days: 5
tests:
  - name: ordinary account suddenly sends 6000 (average is 167 a day), and accounts that must not alert
    as_of: 2026-09-30
    accounts: [{id: A1, product: DEPOSIT}, {id: A2, product: DEPOSIT}, {id: A3, product: DEPOSIT}, {id: A4, product: DEPOSIT}, {id: A5, product: DEPOSIT}]
