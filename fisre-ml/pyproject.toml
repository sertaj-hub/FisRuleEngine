[project]
name = "fisre-ml"
version = "0.1.0"
description = "Unsupervised anomaly scoring for the FIS Rule Engine (ADR-0009)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "psycopg[binary]>=3.1", "joblib>=1.3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fisre-ml = "fisre_ml.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fisre_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
